<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #1f2328;
      background: #f6f8fa;
    }
    header, main, footer {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    header { border-bottom: 1px solid #d0d7de; }
    h1 { margin: 0; }
    footer {
      font-size: 0.875rem;
      color: #656d76;
      border-top: 1px solid #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      header, footer { border-color: #30363d; }
      footer { color: #8b949e; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Hello, world.</h1>
  </header>

  <main>
    <p>This is a starter page. Edit <code>index.html</code> to get started.</p>
  </main>

  <footer>
    <p>&copy; <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
